# Map branches to environments — one job per environment.
#
# Each environment is a distinct workload (workload_name), rolled in place on
# every push, so repeated pushes to a branch always hit the same workload.
# Configure the `production` and `staging` environments (and any required
# reviewers / protection rules) under Settings ▸ Environments.
name: Deploy to environment

on:
  push:
    branches: [main, staging]

jobs:
  # main → Production (uses the manifest name as the workload).
  production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.endpoint }}
    steps:
      - uses: actions/checkout@v4
      - id: deploy
        uses: datarobot-oss/workload-deploy-github@v1
        with:
          datarobot_endpoint: ${{ secrets.DATAROBOT_ENDPOINT }}
          datarobot_api_token: ${{ secrets.DATAROBOT_API_TOKEN }}

  # staging branch → Staging (its own separate workload).
  staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.endpoint }}
    steps:
      - uses: actions/checkout@v4
      - id: deploy
        uses: datarobot-oss/workload-deploy-github@v1
        with:
          datarobot_endpoint: ${{ secrets.DATAROBOT_ENDPOINT }}
          datarobot_api_token: ${{ secrets.DATAROBOT_API_TOKEN }}
          workload_name: my-service-staging
