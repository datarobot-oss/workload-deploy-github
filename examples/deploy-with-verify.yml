# Deploy, then check the deployed version in a follow-up job.
#
# The deploy job exposes the outputs of the action at the job level, so a job
# that lists it under `needs:` can read them.
name: Deploy and verify

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-datarobot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: datarobot
      url: ${{ steps.deploy.outputs.endpoint }}
    outputs:
      endpoint: ${{ steps.deploy.outputs.endpoint }}
      workload_id: ${{ steps.deploy.outputs.workload_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: deploy
        uses: datarobot-oss/workload-deploy-github@v2
        with:
          datarobot_endpoint: ${{ secrets.DATAROBOT_ENDPOINT }}
          datarobot_api_token: ${{ secrets.DATAROBOT_API_TOKEN }}

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the health path
        env:
          ENDPOINT: ${{ needs.deploy.outputs.endpoint }}
          # The endpoint is served under /api/v2, so the call needs the token.
          DATAROBOT_API_TOKEN: ${{ secrets.DATAROBOT_API_TOKEN }}
        # The endpoint ends with a slash. Replace /healthz with the health path
        # of the app.
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${DATAROBOT_API_TOKEN}" "${ENDPOINT}healthz"
