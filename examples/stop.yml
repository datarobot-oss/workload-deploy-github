# Stop the workload by hand from the Actions tab.
#
# Stopping does not delete the workload. `dr workload start <id>` or the next
# deploy brings it back.
name: Stop the DataRobot workload

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: datarobot
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: datarobot-oss/workload-deploy-github/stop@v2
        with:
          datarobot_endpoint: ${{ secrets.DATAROBOT_ENDPOINT }}
          datarobot_api_token: ${{ secrets.DATAROBOT_API_TOKEN }}
