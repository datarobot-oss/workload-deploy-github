# A .datarobot.yaml as `dr workload up` writes it for a service with a Dockerfile.
#
# Do not write this file by hand. Run `dr workload up` in your app directory on
# your machine. It writes the manifest, deploys, and adds this line at the top:
#
#   workloadId: <the ID of your workload> # managed by the CLI
#
# Commit the file with that line. The action reads the workloadId to find the
# workload to roll, and it stops with an error when the line is missing.

name: my-service
importance: low  # low | moderate | high | critical

artifact:
  name: my-service-artifact
  type: service
  spec:
    containerGroups:
      - name: default
        containers:
          - name: primary
            primary: true
            port: 8080  # must be 1024 or above
            imageBuildConfig:  # built from this repository's Dockerfile
              dockerfile:
                source: provided

runtime:
  containerGroups:
    - replicaCount: 1
      containers:
        - name: primary
          resourceAllocation: {cpu: 0.5, memory: 512MB}
