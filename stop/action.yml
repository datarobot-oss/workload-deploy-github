name: DataRobot Workload Stop
description: >-
  Stop the DataRobot Workload named by the workloadId in .datarobot.yaml, with
  `dr workload stop`. The workload is stopped, not deleted. `dr workload start`
  or the next deploy brings it back.
author: DataRobot, Inc.

branding:
  icon: stop-circle
  color: red

inputs:
  datarobot_endpoint:
    description: >-
      DataRobot instance URL, for example https://app.datarobot.com. Falls back
      to the DATAROBOT_ENDPOINT environment variable.
    required: false
    default: ""
  datarobot_api_token:
    description: >-
      DataRobot API key. Pass it from a secret. Falls back to the
      DATAROBOT_API_TOKEN environment variable.
    required: false
    default: ""
  working_directory:
    description: >-
      Directory of the app, relative to the workspace. The CLI looks for
      .datarobot.yaml here and in the parent directories.
    required: false
    default: "."
  dr_cli_version:
    description: DataRobot CLI release to install. The action never uses "latest".
    required: false
    default: v0.13.1
  dr_cli_sha256:
    description: SHA-256 of the CLI archive for this runner. Overrides the checksum table.
    required: false
    default: ""
  dr_cli_download_base:
    description: >-
      Where CLI releases are served, as BASE_URL/VERSION/ARCHIVE. Defaults to
      the GitHub releases of datarobot-oss/cli.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # This action lives in the stop/ folder, so the shared scripts are one
    # level up at the repository root.
    - name: Check the manifest
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/../scripts/check-manifest.sh"
      env:
        DR_WORKING_DIRECTORY: ${{ inputs.working_directory }}
    - name: Install the DataRobot CLI
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/../scripts/install-dr-cli.sh"
      env:
        DR_CLI_VERSION: ${{ inputs.dr_cli_version }}
        DR_CLI_SHA256: ${{ inputs.dr_cli_sha256 }}
        DR_CLI_DOWNLOAD_BASE: ${{ inputs.dr_cli_download_base }}
    - name: Stop
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/../scripts/stop.sh"
      env:
        DATAROBOT_ENDPOINT: ${{ inputs.datarobot_endpoint || env.DATAROBOT_ENDPOINT }}
        DATAROBOT_API_TOKEN: ${{ inputs.datarobot_api_token || env.DATAROBOT_API_TOKEN }}
        DR_WORKING_DIRECTORY: ${{ inputs.working_directory }}
