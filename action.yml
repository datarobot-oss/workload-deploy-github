name: DataRobot Workload Deploy
description: >-
  Deploy a repository to a DataRobot Workload with `dr workload up`, using a
  pinned, checksum-verified DataRobot CLI. The workload is the one named by the
  workloadId in the committed .datarobot.yaml, so every run rolls the same
  workload.
author: DataRobot, Inc.

branding:
  icon: upload-cloud
  color: green

inputs:
  datarobot_endpoint:
    description: >-
      DataRobot instance URL, for example https://app.datarobot.com. The
      /api/v2 suffix is optional. Falls back to the DATAROBOT_ENDPOINT
      environment variable.
    required: false
    default: ""
  datarobot_api_token:
    description: >-
      DataRobot API key. Pass it from a secret. Falls back to the
      DATAROBOT_API_TOKEN environment variable.
    required: false
    default: ""
  working_directory:
    description: >-
      Directory of the app, relative to the workspace. The CLI looks for
      .datarobot.yaml here and in the parent directories.
    required: false
    default: "."
  promote:
    description: >-
      Make the deployed version permanent by locking its artifact. A draft
      workload stops after 8 hours. A workload whose artifact is already locked
      keeps getting locked versions without this.
    required: false
    default: "true"
  dry_run:
    description: >-
      Print the plan and change nothing. Use it on pull requests, with the same
      other inputs as the deploy.
    required: false
    default: "false"
  allow_create:
    description: >-
      Let this run create the workload when .datarobot.yaml has no workloadId.
      Use it once. The run prints the workloadId to commit, and without it every
      later run creates another workload.
    required: false
    default: "false"
  dr_cli_version:
    description: >-
      DataRobot CLI release to install. The action never uses "latest". A
      version needs a checksum in scripts/dr-cli-checksums.txt, or
      dr_cli_sha256.
    required: false
    default: v0.14.1
  dr_cli_sha256:
    description: >-
      SHA-256 of the CLI archive for this runner. Overrides the checksum table,
      so a version that is not in the table can be installed.
    required: false
    default: ""
  dr_cli_download_base:
    description: >-
      Where CLI releases are served, as BASE_URL/VERSION/ARCHIVE. Defaults to
      the GitHub releases of datarobot-oss/cli. Set it to a mirror in a network
      that cannot reach GitHub.
    required: false
    default: ""

outputs:
  workload_id:
    description: The workloadId of the workload. Empty on a dry run.
    value: ${{ steps.deploy.outputs.workload_id }}
  endpoint:
    description: The endpoint URL of the workload, with a trailing slash. Empty on a dry run.
    value: ${{ steps.deploy.outputs.endpoint }}

runs:
  using: composite
  steps:
    - name: Check the manifest
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/check-manifest.sh"
      env:
        DR_WORKING_DIRECTORY: ${{ inputs.working_directory }}
        DR_ALLOW_CREATE: ${{ inputs.allow_create }}
    - name: Install the DataRobot CLI
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/install-dr-cli.sh"
      env:
        DR_CLI_VERSION: ${{ inputs.dr_cli_version }}
        DR_CLI_SHA256: ${{ inputs.dr_cli_sha256 }}
        DR_CLI_DOWNLOAD_BASE: ${{ inputs.dr_cli_download_base }}
    - id: deploy
      name: Deploy
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/deploy.sh"
      env:
        DATAROBOT_ENDPOINT: ${{ inputs.datarobot_endpoint || env.DATAROBOT_ENDPOINT }}
        DATAROBOT_API_TOKEN: ${{ inputs.datarobot_api_token || env.DATAROBOT_API_TOKEN }}
        DR_WORKING_DIRECTORY: ${{ inputs.working_directory }}
        DR_PROMOTE: ${{ inputs.promote }}
        DR_DRY_RUN: ${{ inputs.dry_run }}
